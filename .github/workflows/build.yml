name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
          cache: true

      - name: Verify Go source
        run: |
          go test ./...
          go vet ./...

      - name: Verify version and native mod API compatibility
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $source = Get-Content util.go -Raw
          if ($source -notmatch ('const loaderVersion = "' + [regex]::Escape($version) + '"')) {
            throw "VERSION does not match loaderVersion"
          }
          $apiBlob = (git hash-object src/API/KeeperLoaderApi.cs).Trim()
          if ($apiBlob -ne "0cc3c28cdb6cb51a88709c5b23e45fb40f5cac72") {
            throw "KeeperLoader API changed; native mod compatibility review is required"
          }

      - name: Build executable-free Graveyard Keeper runtime
        shell: pwsh
        run: ./scripts/build-runtime.ps1

      - name: Generate Windows resource
        run: go generate ./...

      - name: Build optional Windows manager
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: go build -buildvcs=false -trimpath -ldflags="-H=windowsgui" -o KeeperLoader-Manager.exe .

      - name: Verify manager metadata
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $metadata = (Get-Item KeeperLoader-Manager.exe).VersionInfo
          if ($metadata.ProductName -ne "KeeperLoader") { throw "KeeperLoader product metadata is missing" }
          if ($metadata.ProductVersion -ne $version) { throw "Executable product version does not match VERSION" }
          if ($metadata.OriginalFilename -ne "KeeperLoader-Manager.exe") { throw "Executable original filename is invalid" }

      - name: Package optional manager
        shell: pwsh
        run: ./scripts/package-manager.ps1

      - name: Verify easy-install and mod-management release contract
        shell: pwsh
        run: |
          $managerSource = (Get-Content install.go -Raw) + (Get-Content mods.go -Raw)
          foreach ($forbidden in @('net/http', 'go:embed src/', 'findCSharpCompiler', 'runCompiler')) {
            if ($managerSource.Contains($forbidden)) { throw "Manager still contains forbidden on-device downloader/compiler behavior: $forbidden" }
          }
          $ui = Get-Content main.go -Raw
          foreach ($required in @('Install / update KeeperLoader', 'Install Mod ZIP', 'Update selected from ZIP', 'Enable / disable selected', 'Restore previous', 'Uninstall selected')) {
            if (-not $ui.Contains($required)) { throw "Required manager operation is missing: $required" }
          }
          foreach ($required in @(
            'manager-package/runtime/winhttp.dll',
            'manager-package/runtime/doorstop_config.ini',
            'manager-package/runtime/KeeperLoader/core/KeeperLoader.API.dll',
            'manager-package/runtime/KeeperLoader/core/KeeperLoader.Bootstrap.dll',
            'manager-package/runtime/KeeperLoader/core/KeeperLoader.Runtime.dll',
            'manager-package/runtime/SHA256SUMS.txt'
          )) {
            if (-not (Test-Path $required)) { throw "Manager package is missing bundled runtime file: $required" }
          }

      - name: Scan release payloads with Microsoft Defender when available
        shell: pwsh
        run: |
          if (-not (Get-Command Get-MpComputerStatus -ErrorAction SilentlyContinue)) {
            Write-Host "Microsoft Defender cmdlets are unavailable on this runner."
            exit 0
          }
          $status = Get-MpComputerStatus
          if (-not $status.AntivirusEnabled) {
            Write-Host "Microsoft Defender Antivirus is disabled on this runner."
            exit 0
          }
          Update-MpSignature -ErrorAction Continue
          $targets = @(
            (Resolve-Path runtime-package).Path,
            (Resolve-Path "dist/KeeperLoader-GraveyardKeeper-Runtime-v*.zip").Path,
            (Resolve-Path KeeperLoader-Manager.exe).Path,
            (Resolve-Path "dist/KeeperLoader-Manager-Windows-x64-v*.zip").Path
          )
          foreach ($target in $targets) {
            try { Start-MpScan -ScanType CustomScan -ScanPath $target -ErrorAction Stop }
            catch {
              Write-Warning "Microsoft Defender could not scan $target on this hosted runner: $($_.Exception.Message)"
              exit 0
            }
          }
          $roots = $targets | ForEach-Object { $_.ToLowerInvariant() }
          $detections = Get-MpThreatDetection | Where-Object {
            $resources = ($_.Resources -join "`n").ToLowerInvariant()
            $roots | Where-Object { $resources -like "*$_*" }
          }
          if ($detections) {
            $detections | Format-List * | Out-String | Write-Host
            throw "Microsoft Defender detected a KeeperLoader release payload"
          }

      - name: Upload executable-free runtime
        uses: actions/upload-artifact@v4
        with:
          name: KeeperLoader-GraveyardKeeper-Runtime
          path: dist/KeeperLoader-GraveyardKeeper-Runtime-v*.zip
          if-no-files-found: error

      - name: Upload optional manager
        uses: actions/upload-artifact@v4
        with:
          name: KeeperLoader-Manager-Windows-x64
          path: dist/KeeperLoader-Manager-Windows-x64-v*.zip
          if-no-files-found: error

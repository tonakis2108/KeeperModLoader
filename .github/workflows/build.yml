name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-manager:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
          cache: true

      - name: Verify source
        run: go vet ./...

      - name: Build Windows GUI
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: go build -buildvcs=false -trimpath -ldflags="-s -w -H=windowsgui" -o KeeperLoader-Manager.exe .

      - name: Generate checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash KeeperLoader-Manager.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  KeeperLoader-Manager.exe" | Set-Content SHA256SUMS.txt

      - name: Upload manager artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeeperLoader-Windows-x64
          path: |
            KeeperLoader-Manager.exe
            README.md
            DEVELOPING_MODS.md
            LICENSE
            THIRD_PARTY.md
            THIRD_PARTY_LICENSES.txt
            SHA256SUMS.txt
          if-no-files-found: error

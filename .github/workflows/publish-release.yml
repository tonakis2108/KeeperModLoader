name: Publish KeeperLoader Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-release.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
          cache: true

      - name: Verify source
        run: |
          go test ./...
          go vet ./...

      - name: Build executable-free runtime
        shell: pwsh
        run: ./scripts/build-runtime.ps1

      - name: Generate resource and build optional manager
        shell: pwsh
        run: |
          go generate ./...
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -buildvcs=false -trimpath -ldflags="-H=windowsgui" -o KeeperLoader-Manager.exe .
          if ($LASTEXITCODE -ne 0) { throw "Manager build failed" }
          ./scripts/package-manager.ps1

      - name: Verify release structure and metadata
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -ne "0.7.5") { throw "This workflow publishes v0.7.5, but VERSION is $version" }
          $metadata = (Get-Item KeeperLoader-Manager.exe).VersionInfo
          if ($metadata.ProductVersion -ne $version) { throw "Manager metadata does not match VERSION" }
          $apiBlob = (git hash-object src/API/KeeperLoaderApi.cs).Trim()
          if ($apiBlob -ne "0cc3c28cdb6cb51a88709c5b23e45fb40f5cac72") {
            throw "KeeperLoader API changed; native mods may require changes"
          }
          if (Get-ChildItem runtime-package -Recurse -File -Filter *.exe) {
            throw "Executable found in Nexus runtime package"
          }
          $managerSource = (Get-Content install.go -Raw) + (Get-Content mods.go -Raw)
          foreach ($forbidden in @('net/http', 'go:embed src/', 'findCSharpCompiler', 'runCompiler')) {
            if ($managerSource.Contains($forbidden)) { throw "Manager still contains downloader/compiler behavior: $forbidden" }
          }
          $ui = Get-Content main.go -Raw
          foreach ($required in @('Install / update KeeperLoader', 'Install Mod ZIP', 'Update selected from ZIP', 'Enable / disable selected', 'Restore previous', 'Uninstall selected')) {
            if (-not $ui.Contains($required)) { throw "Required manager operation is missing: $required" }
          }
          foreach ($required in @(
            'manager-package/runtime/winhttp.dll',
            'manager-package/runtime/doorstop_config.ini',
            'manager-package/runtime/KeeperLoader/core/KeeperLoader.API.dll',
            'manager-package/runtime/KeeperLoader/core/KeeperLoader.Bootstrap.dll',
            'manager-package/runtime/KeeperLoader/core/KeeperLoader.Runtime.dll',
            'manager-package/runtime/SHA256SUMS.txt'
          )) {
            if (-not (Test-Path $required)) { throw "Manager package is missing bundled runtime file: $required" }
          }

      - name: Scan all release payloads with Microsoft Defender
        shell: pwsh
        run: |
          if (-not (Get-Command Get-MpComputerStatus -ErrorAction SilentlyContinue)) {
            throw "Microsoft Defender cmdlets are unavailable on this runner"
          }
          $status = Get-MpComputerStatus
          if (-not $status.AntivirusEnabled) { throw "Microsoft Defender Antivirus is disabled on this runner" }
          Update-MpSignature -ErrorAction Continue
          $targets = @(
            (Resolve-Path runtime-package).Path,
            (Resolve-Path "dist/KeeperLoader-GraveyardKeeper-Runtime-v*.zip").Path,
            (Resolve-Path KeeperLoader-Manager.exe).Path,
            (Resolve-Path "dist/KeeperLoader-Manager-Windows-x64-v*.zip").Path
          )
          foreach ($target in $targets) { Start-MpScan -ScanType CustomScan -ScanPath $target -ErrorAction Stop }
          $roots = $targets | ForEach-Object { $_.ToLowerInvariant() }
          $detections = Get-MpThreatDetection | Where-Object {
            $resources = ($_.Resources -join "`n").ToLowerInvariant()
            $roots | Where-Object { $resources -like "*$_*" }
          }
          if ($detections) {
            $detections | Format-List * | Out-String | Write-Host
            throw "Microsoft Defender detected a KeeperLoader release payload"
          }

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $runtime = (Resolve-Path "dist/KeeperLoader-GraveyardKeeper-Runtime-v$version.zip").Path
          $manager = (Resolve-Path "dist/KeeperLoader-Manager-Windows-x64-v$version.zip").Path
          @"
          ## KeeperLoader v$version for Graveyard Keeper

          ### Clean Nexus/manual download

          **KeeperLoader-GraveyardKeeper-Runtime-v$version.zip** is the clean, executable-free runtime package. It contains precompiled managed KeeperLoader DLLs and the official unmodified UnityDoorstop x64 proxy. It contains no EXE, downloader, self-updater, compiler, scripts, or external-plugin loader.

          Extract it directly beside `Graveyard Keeper.exe` while the game is closed.

          ### Easiest installation: optional manager

          **KeeperLoader-Manager-Windows-x64-v$version.zip** keeps Steam detection, validated native-mod installation and updates, enable/disable, rollback, safe mode, complete removal, and the verified manager updater. Extract the complete ZIP, run the manager, and select **Install / update KeeperLoader**. The manager now installs the bundled precompiled runtime without downloading UnityDoorstop or invoking a compiler on the player's PC.

          Version 0.7.5 corrects the precompiled Unity API member contract that prevented the runtime host from being created on Graveyard Keeper. Host creation is also deferred until Unity enters its frame loop, restoring native mod startup and per-frame callbacks.

          Managers v0.7.4 and newer can apply this update through **Install manager update**. Managers v0.7.3 and older must extract the complete v0.7.5 ZIP into a new folder and run it directly once because their updater contains the older cross-version validation bug.

          Existing compiled native KeeperLoader mods require no source or API changes. The public API source is byte-for-byte unchanged from v0.6.2 and CI enforces that compatibility boundary. Legacy source-only ZIPs must be converted once on the publisher side; the manager never compiles code on a player's PC.

          Microsoft Defender scans both release payloads before publication. A multi-vendor service can still produce heuristic false positives, so no project can guarantee a particular future VirusTotal result. Do not disable antivirus or create exclusions.
          "@ | Set-Content RELEASE_NOTES.md

          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $runtime $manager --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw "Could not update release assets" }
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --title "KeeperLoader v$version" --notes-file RELEASE_NOTES.md --prerelease
          } else {
            gh release create $tag $runtime $manager --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "KeeperLoader v$version" --notes-file RELEASE_NOTES.md --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not publish release" }

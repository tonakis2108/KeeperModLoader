name: Publish KeeperLoader Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
          cache: true

      - name: Verify source
        run: |
          go test ./...
          go vet ./...

      - name: Verify embedded C# runtime
        shell: pwsh
        run: |
          $framework = Get-ChildItem "$env:WINDIR\Microsoft.NET\Framework64" -Directory |
            Sort-Object Name -Descending |
            Where-Object { Test-Path (Join-Path $_.FullName "csc.exe") } |
            Select-Object -First 1
          if (-not $framework) {
            throw "A .NET Framework C# compiler was not found"
          }
          $csc = Join-Path $framework.FullName "csc.exe"
          New-Item -ItemType Directory -Force build-csharp | Out-Null
          & $csc /nologo /target:library /out:build-csharp\KeeperLoader.API.dll src\API\KeeperLoaderApi.cs
          if ($LASTEXITCODE -ne 0) { throw "KeeperLoader API compilation failed" }
          & $csc /nologo /target:library /out:build-csharp\KeeperLoader.Bootstrap.dll src\Bootstrap\Entrypoint.cs
          if ($LASTEXITCODE -ne 0) { throw "KeeperLoader bootstrap compilation failed" }
          $runtimeSources = Get-ChildItem src\Runtime\*.cs | ForEach-Object FullName
          & $csc /nologo /target:library /out:build-csharp\KeeperLoader.Runtime.dll /reference:build-csharp\KeeperLoader.API.dll $runtimeSources src\Runtime.Tests\UnityEngineStubs.cs
          if ($LASTEXITCODE -ne 0) { throw "KeeperLoader runtime compilation failed" }

      - name: Generate Windows resource
        run: go generate ./...

      - name: Build Windows manager
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: go build -buildvcs=false -trimpath -ldflags="-H=windowsgui" -o KeeperLoader-Manager.exe .

      - name: Verify product metadata
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $metadata = (Get-Item KeeperLoader-Manager.exe).VersionInfo
          if ($metadata.ProductName -ne "KeeperLoader") {
            throw "KeeperLoader product metadata is missing"
          }
          if ($metadata.ProductVersion -ne $version) {
            throw "Executable product version does not match VERSION"
          }
          if ($metadata.OriginalFilename -ne "KeeperLoader-Manager.exe") {
            throw "Executable original filename metadata is invalid"
          }

      - name: Scan with Microsoft Defender
        shell: pwsh
        run: |
          if (-not (Get-Command Get-MpComputerStatus -ErrorAction SilentlyContinue)) {
            throw "Microsoft Defender cmdlets are unavailable on this runner"
          }
          $status = Get-MpComputerStatus
          if (-not $status.AntivirusEnabled) {
            throw "Microsoft Defender Antivirus is disabled on this runner"
          }
          Update-MpSignature -ErrorAction Continue
          $manager = (Resolve-Path KeeperLoader-Manager.exe).Path
          Start-MpScan -ScanType CustomScan -ScanPath $manager -ErrorAction Stop
          $detections = Get-MpThreatDetection | Where-Object {
            $_.Resources -and (($_.Resources -join "`n") -like "*$manager*")
          }
          if ($detections) {
            $detections | Format-List * | Out-String | Write-Host
            throw "Microsoft Defender detected the KeeperLoader manager build"
          }

      - name: Package release
        id: package
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $expected = "0.6.1"
          if ($version -ne $expected) {
            throw "This workflow publishes v$expected, but VERSION is $version"
          }
          $hash = (Get-FileHash KeeperLoader-Manager.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  KeeperLoader-Manager.exe" | Set-Content SHA256SUMS.txt
          $archive = "KeeperLoader-Windows-x64-v$version.zip"
          $files = @(
            "KeeperLoader-Manager.exe",
            "VERSION",
            "README.md",
            "DEVELOPING_MODS.md",
            "LICENSE",
            "THIRD_PARTY.md",
            "THIRD_PARTY_LICENSES.txt",
            "SHA256SUMS.txt"
          )
          Compress-Archive -Path $files -DestinationPath $archive -CompressionLevel Optimal
          "archive=$archive" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          @"
          ## KeeperLoader v$env:VERSION

          Portable Windows x64 release for Graveyard Keeper and compatible Unity Mono games.

          ### Highlights

          - Install, update, enable, disable, restore and remove KeeperLoader mods.
          - Launch supported games through Steam.
          - Preserve mod configuration, state and backups during updates.
          - User-selected safe mode for one launch.
          - Validated mod packages with SHA-256 integrity checks.

          ### Installation

          1. Download `$env:ARCHIVE`.
          2. Extract it to a permanent folder outside the game installation.
          3. Run `KeeperLoader-Manager.exe`.
          4. Select **Scan Steam**.
          5. Select Graveyard Keeper and choose **Enable / update selected**.

          The executable is currently unsigned. Do not disable antivirus protection or create exclusions. Verify `KeeperLoader-Manager.exe` against `SHA256SUMS.txt`.
          "@ | Set-Content RELEASE_NOTES.md

          $tag = "v$env:VERSION"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $env:ARCHIVE --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw "Could not update release asset" }
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --title "KeeperLoader v$env:VERSION" --notes-file RELEASE_NOTES.md --prerelease
            if ($LASTEXITCODE -ne 0) { throw "Could not update release metadata" }
          } else {
            gh release create $tag $env:ARCHIVE --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "KeeperLoader v$env:VERSION" --notes-file RELEASE_NOTES.md --prerelease
            if ($LASTEXITCODE -ne 0) { throw "Could not create release" }
          }
